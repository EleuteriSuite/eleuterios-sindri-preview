<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo estático: Card</title>
    <!-- Nota: Tailwind standalone ya está integrado en el proyecto principal. -->
  </head>
  <body class="p-6 space-y-6">
    <section class="space-y-4">
      <h2 class="text-lg font-semibold">Card básica</h2>
      <div class="bg-card text-card-foreground flex flex-col gap-6 rounded-xl border py-6 shadow-sm">
        <div class="@container/card-header grid auto-rows-min grid-rows-[auto_auto] items-start gap-1.5 px-6 has-data-[slot=card-action]:grid-cols-[1fr_auto] [.border-b]:pb-6">
          <h3 class="leading-none font-semibold">Título de la tarjeta</h3>
          <p class="text-muted-foreground text-sm">Descripción breve de la tarjeta.</p>
          <div class="col-start-2 row-span-2 row-start-1 self-start justify-self-end">
            <button type="button" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg:not([class*='size-'])]:size-4 shrink-0 [&_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive bg-primary text-primary-foreground hover:bg-primary/90 h-9 px-4 py-2 has-[>svg]:px-3">Acción</button>
          </div>
        </div>
        <div class="px-6">
          <p>Contenido principal de la tarjeta. Aquí puedes colocar texto, listas o cualquier otro contenido estático.</p>
        </div>
        <div class="flex items-center px-6 [.border-t]:pt-6">
          <span class="text-sm text-muted-foreground">Pie de tarjeta opcional</span>
        </div>
      </div>
    </section>
  </body>
  </html>
