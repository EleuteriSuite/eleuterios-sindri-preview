<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta charset="UTF-8" />
    <title>Sindri Previewer</title>
    <link rel="icon" href="/_media/logo.png?v=0.1.0" type="image/png">
    <link rel="stylesheet" href="assets/docsify/themes/core.min.css?v=0.1.0" />
    <link rel="stylesheet" href="assets/docsify/themes/addons/vue.min.css?v=0.1.0" />
    <link rel="stylesheet" href="assets/sindri.min.css?v=0.1.0" />
    <script type="module" src="assets/tailwindcss/tailwindcss.min.js?v=0.1.0"></script>
</head>
<body>
<div data-app id="app">&nbsp;</div>
<script>
    window.$docsify = {
        logo: '/_media/logo.png',
        relativePath: true,
        loadNavbar: false,
        themeColor: '#6A42B4',
        name: 'sindri-previewer',
        hideSidebar: true,
        auto2top: true,
        executeScript: true,
        requestHeaders: {
            'cache-control': 'max-age=600',
        },
        notFoundPage: false,
    };
</script>
<script src="assets/docsify/docsify.js?v=0.1.0"></script>
<script type="module" src="assets/main.js?v=0.1.0"></script>
</body>
</html>
