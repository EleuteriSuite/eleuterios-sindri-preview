<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta charset="UTF-8" />
    <title>Sindri Previewer</title>
    <link rel="icon" href="/_media/logo.png" type="image/png">
    <link rel="stylesheet" href="assets/docsify/vue.css" />
    <link rel="stylesheet" href="assets/to_compile/docsify_custom.css" />
    <script src="assets/tailwindcss.min.js"></script>
</head>
<body>
<div data-app id="app">&nbsp;</div>
<script>
    window.$docsify = {
        logo: '/_media/logo.png',
        relativePath: true,
        loadNavbar: false,
        themeColor: '#6A42B4',
        name: 'sindri-previewer',
        hideSidebar: true,
        auto2top: true,
        executeScript: true,
        requestHeaders: {
            'cache-control': 'max-age=600',
        },
        notFoundPage: false,
    };
</script>
<script src="assets/docsify/docsify.min.js"></script>
<script src="assets/flyonui.js"></script>
</body>
</html>
